<style>

  /* 오프닝 */
  .opening { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: #faf8f4; color: #39322c; transition: opacity .6s ease, visibility .6s ease; }

  .opening::before, .opening::after { content: ""; position: absolute; width: min(74vw, 360px); aspect-ratio: 1; border: 1px solid rgba(121,93,68,.13); border-radius: 50%; }

  .opening-card h1 { margin: 0; font: 400 clamp(30px, 8vw, 40px)/1.25 var(--script); clip-path: inset(0 100% 0 0); animation: wipe 1.6s cubic-bezier(.2,.7,.2,1) .2s forwards; }

  .reveal.on { opacity: 1; transform: none; }

  /* 커버 */

  .hero { position: relative; height: min(184vw, 100svh, 880px); min-height: 560px; color: #fff; text-align: center; overflow: hidden; }

  .hero .ph { background: linear-gradient(180deg, #2f3a2c 0%, #4a5a44 45%, #7d8c72 75%, #a9b39c 100%); color: rgba(255,255,255,.5); align-items: center; padding-top: 40%; }
  .hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,14,10,.45) 0%, rgba(10,14,10,.12) 38%, rgba(0,0,0,0) 60%); pointer-events: none; }
  .hero-text { position: relative; z-index: 2; padding: 13% 20px 0; text-shadow: 0 1px 12px rgba(0,0,0,.25); }
  .hero-kicker { font: 400 13px var(--en); letter-spacing: .22em; }
  .hero-names { margin: 18px 0 20px; display: flex; justify-content: center; align-items: baseline; gap: .45em; font: 400 clamp(30px, 8.6vw, 42px)/1.1 var(--script); white-space: nowrap; }

  .hero-ko { margin: 0; font: 400 15px var(--serif); letter-spacing: .12em; }

  .snow i { position: absolute; top: -10px; border-radius: 50%; background: rgba(255,255,255,.85); animation: fall linear infinite; }
  @keyframes fall { to { transform: translate3d(var(--dx), 110vh, 0); } }

  /* 공통 섹션 */

  .heading span { color: var(--accent); font-size: 11px; letter-spacing: .16em; }
  h2 { margin: 11px 0 0; font: 400 24px/1.45 var(--serif); }

  .message > em { color: var(--accent); font: 400 30px/1.25 var(--script); }
  .message p { margin: 22px auto 0; color: var(--muted); font-size: min(14px, 3.6vw); line-height: 2; white-space: pre-line; word-break: keep-all; }

  .ceremony { border-block: 1px solid var(--line); }

  .map-links { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 28px; }
  .map-links a { border: 1px solid var(--ink); background: var(--ink); color: var(--paper); border-radius: 6px; padding: 13px 8px; text-decoration: none; font-size: 14px; }


  /* 우리의 순간: 클래식 앨범(챕터 번호, 매트 액자, 세리프, 가는 금색 선) */
  .story { padding: 62px 26px 0; }
  .story .heading { text-align: center; }
  .chapter { margin-top: 56px; }
  .ch-row { display: flex; align-items: center; gap: 20px; }
  .ch-row.rev { flex-direction: row-reverse; }
  /* 사진 테두리, 매트, 안쪽 선은 넣지 않는다(2026-11-23 사용자 결정) */
  .frame { position: relative; flex: 0 0 auto; margin: 0; padding: 0; border: 0; background: none; cursor: zoom-in; font: inherit; color: inherit; }
  .frame.empty { cursor: default; }
  .frame img { display: block; width: 100%; height: auto; } /* 사진은 원본 비율 그대로(자르지 않음) */
  .frame .ph { display: block; width: 100%; aspect-ratio: 3 / 4; }
  .frame.land .ph { aspect-ratio: 3 / 2; }
  .frame .ph.hint { padding: 10px; background: #f3f1ec; color: #9a9384; font: 400 12px/1.7 var(--serif); letter-spacing: 0; white-space: pre-line; text-align: center; word-break: keep-all; }
  .ch-row .frame { width: 47%; }
  .ch-row .frame.land { width: 54%; }
  .wide .frame { width: 100%; }
  .duo { display: flex; gap: 10px; align-items: flex-start; }
  .duo .frame { width: calc(50% - 5px); }
  .duo .frame:last-child { margin-top: 34px; }
  .duo.pair .frame:last-child { margin-top: 0; }
  .ch-text { flex: 1; min-width: 0; text-align: left; }
  .wide .ch-text, .duo-wrap .ch-text { margin-top: 24px; text-align: center; }
  .ch-text .date { margin: 0 0 8px; font: 500 13px var(--en); letter-spacing: .22em; color: var(--accent); }
  .ch-text h3 { margin: 0 0 10px; font: 500 17px/1.5 var(--serif); color: var(--ink); word-break: keep-all; text-wrap: balance; }
  .ch-text p { margin: 0; font: 400 13.5px/2 var(--serif); color: var(--muted); word-break: keep-all; white-space: pre-line; }
  .story .end { margin: 52px 0 0; text-align: center; font: 400 28px var(--script); color: var(--accent); }
  .btn-line { display: block; width: 100%; margin: 18px auto 0; border: 1px solid var(--line); padding: 13px; background: transparent; color: var(--ink); font-size: 13px; cursor: pointer; }

  /* 웨딩 사진: 제목 없이(2026-11-23) 두 줄 격자, 원본 비율 그대로, 테두리 없음 */
  .gallery { padding: 52px 20px 66px; } /* 위 여백 = with love 위 여백(52px). 그래서 .story 아래 여백은 0 */
  .g-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; align-items: start; }
  .g-grid .frame { width: 100%; }
  .g-grid .frame.full { grid-column: 1 / -1; }
  .lightbox { position: fixed; inset: 0; z-index: 50; display: none; place-items: center; padding: 24px 16px; background: rgba(16,20,24,.88); }
  .lightbox.open { display: grid; }
  .lightbox .ph, .lightbox img { width: min(92vw, 440px); aspect-ratio: 4 / 5; object-fit: contain; }
  .lightbox .close { position: absolute; top: 14px; right: 18px; border: 0; background: none; color: #fff; font-size: 34px; cursor: pointer; }
  .lightbox .nav { position: absolute; top: 50%; transform: translateY(-50%); border: 0; background: none; color: #fff; font-size: 30px; padding: 16px; cursor: pointer; }
  .lightbox .prev { left: 0; } .lightbox .next { right: 0; }
  .lightbox .count { position: absolute; bottom: 20px; color: #fff; font-size: 12px; letter-spacing: .1em; }

  .transport { text-align: left; padding-bottom: 52px; }
  .transport .heading { text-align: center; margin-bottom: 28px; }
  .t-item { padding: 18px 0; border-top: 1px solid var(--line); }
  .t-item:last-of-type { border-bottom: 1px solid var(--line); }
  .t-item h3 { margin: 0; color: var(--ink); font: 500 14px var(--sans); }
  .t-item p { margin: 9px 0 0; color: var(--muted); font-size: 14px; line-height: 1.8; white-space: pre-line; }
  .map-img { display: block; width: 100%; margin: 0 0 8px; border-radius: 6px; }
  .ceremony .notice { margin-top: 22px; font-size: min(13px, 3.3vw); color: var(--muted); white-space: pre-line; }
  .save-cal { margin-top: 28px; }
  .save-cal + .map-links { margin-top: 12px; }
  .save-cal .btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .save-cal a { border: 1px solid var(--line); border-radius: 6px; padding: 11px 4px; color: var(--ink); text-decoration: none; font-size: 13px; background: var(--paper); white-space: nowrap; }
  .save-cal a small { font-size: 10.5px; font-weight: 300; color: var(--muted); letter-spacing: -.01em; }
  .note { margin-top: 18px; padding: 15px 16px; background: var(--warm); color: var(--muted); font-size: 13px; line-height: 1.7; text-align: center; }

  .contacts { border-top: 1px solid var(--line); }
  .contact-sum { display: grid; gap: 14px; margin-top: 28px; font-size: 14px; }
  .contact-sum p { margin: 0; color: var(--muted); font-size: 13px; }
  .contact-sum .rel { font-style: normal; font-size: 12px; margin-left: 4px; }
  .contact-sum strong { display: block; margin-top: 4px; font-weight: 500; font-size: 15px; }
  .contact-open { margin-top: 28px; width: 100%; border: 1px solid var(--line); border-radius: 7px; padding: 14px; background: var(--paper); color: var(--ink); font-size: 14px; cursor: pointer; }
  .modal { position: fixed; inset: 0; z-index: 60; display: none; place-items: center; padding: 20px; background: rgba(34,31,27,.48); }
  .modal.open { display: grid; }
  .modal-box { position: relative; width: min(100%, 400px); max-height: 84vh; overflow: auto; padding: 38px 22px 24px; border-radius: 16px; background: #fbfaf7; box-shadow: 0 22px 60px rgba(26,20,14,.25); }
  .modal-box > span { display: block; text-align: center; color: var(--accent); font-size: 10px; letter-spacing: .2em; }
  .modal-box h2 { text-align: center; font-size: 22px; }
  .modal-close { position: absolute; top: 10px; right: 14px; border: 0; background: none; color: var(--muted); font-size: 30px; font-weight: 200; cursor: pointer; }
  .c-group { margin-top: 24px; }
  .c-group h3 { margin: 0 0 6px; color: var(--accent); font: 500 12px var(--sans); letter-spacing: .08em; }
  .c-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 2px; border-top: 1px solid var(--line); font-size: 14px; }
  .c-row:last-child { border-bottom: 1px solid var(--line); }
  .c-row span { color: var(--muted); font-size: 12px; display: inline-block; width: 44px; }
  .c-row .links { display: flex; gap: 8px; }
  .c-row a { border: 1px solid var(--line); background: var(--paper); border-radius: 50%; width: 36px; height: 36px; display: grid; place-items: center; color: var(--ink); text-decoration: none; font-size: 14px; }
  .c-row a svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .c-row a.off { opacity: .3; pointer-events: none; }

  .accounts .heading p { margin: 13px 0 25px; color: var(--muted); font-size: 12px; line-height: 1.8; }
  .acc-group { border-radius: 8px; overflow: hidden; margin-top: 10px; text-align: left; border: 1px solid var(--line); }
  .acc-toggle { width: 100%; display: flex; justify-content: space-between; padding: 17px 16px; border: 0; background: var(--paper); color: var(--ink); font-size: 14px; font-weight: 500; cursor: pointer; }
  .acc-toggle span { color: var(--muted); transition: transform .2s; }
  .acc-group.open .acc-toggle span { transform: rotate(180deg); }
  .acc-items { display: none; gap: 10px; padding: 10px; background: var(--warm); }
  .acc-group.open .acc-items { display: grid; }
  .acc-items article { padding: 16px; border-radius: 10px; background: var(--paper); box-shadow: 0 5px 12px rgba(30,43,54,.07); }
  .acc-person { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
  .acc-person b { color: var(--ink); font-weight: 500; }
  .acc-row { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: 14px; }
  .acc-row button { border: 1px solid var(--line); background: var(--paper); border-radius: 6px; padding: 6px 10px; font-size: 12px; color: var(--ink); cursor: pointer; }

  .btn-dark { width: 100%; border: 0; border-radius: 7px; padding: 15px; background: var(--ink); color: var(--paper); font-size: 14px; font-weight: 500; cursor: pointer; }

  .share { border-top: 1px solid var(--line); }
  .share .btns { display: grid; gap: 8px; margin-top: 26px; }
  .share .btns button { border-radius: 8px; } /* 위 마음 전하실 곳 상자(.acc-group)와 같은 라운드 */
  footer { padding: 30px 0 46px; text-align: center; color: var(--muted); font-size: 11px; letter-spacing: .12em; }

  .music { position: fixed; top: 14px; right: max(14px, calc(50% - 240px + 14px)); z-index: 40; border: 0; border-radius: 20px; padding: 7px 12px; background: rgba(255,255,255,.82); color: var(--ink); font-size: 11px; letter-spacing: .08em; box-shadow: 0 2px 10px rgba(0,0,0,.12); cursor: pointer; backdrop-filter: blur(4px); }
  .music[aria-pressed="true"] span { display: inline-block; animation: spin 3s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .toast { position: fixed; left: 50%; bottom: 40px; transform: translate(-50%, 20px); padding: 11px 18px; border-radius: 20px; background: rgba(47,60,73,.92); color: #fff; font-size: 13px; opacity: 0; transition: .25s; z-index: 200; pointer-events: none; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>

<script>
// ===== 청첩장 내용: 여기만 고치면 된다 =====
const W = {
  groom: { name: "한현택", en: "Hyun Taek", enFull: "HYUNTAEK HAN", father: "한종부", mother: "안숙", rel: "장남", phone: "010-4072-1977", fatherPhone: "010-3718-8867", motherPhone: "010-9479-1977" }, // TODO: 연락처 (예: "010-0000-0000")
  bride: { name: "김민서", en: "Min Seo", enFull: "MINSEO KIM", father: "김을문", mother: "정윤성", rel: "장녀", phone: "010-6345-0815", fatherPhone: "010-3455-1382", motherPhone: "010-3565-0716" },
  date: "2027-02-14T15:00:00+09:00",
  venue: "라마다 서울 신도림 호텔",
  hall: "5층 세인트 그레이스홀",
  address: "서울특별시 구로구 경인로 624 (신도림동 427-3)",
  // 길찾기: 도착지가 호텔로 정해진 채로 열린다. 출발지는 현재 위치 (좌표 37.50631, 126.88528)
  route: {
    kakao: "https://map.kakao.com/link/to/라마다서울신도림호텔,37.50631,126.88528",
    naver: "https://map.naver.com/p/directions/-/3zdM40,2AJwsu,라마다서울신도림호텔,986184099,PLACE_POI/-/transit?c=15.00,0,0,0,dh",
  },
  notice: "화환은 정중히 사양하오니 너른 양해 부탁드립니다.",
  message: `2022년 2월 13일, 설레는 마음으로 사랑을 시작한 저희가
2027년 2월 14일, 평생을 함께할 사랑을 약속하려 합니다.

귀한 걸음으로 그 시작을 함께해 주신다면
더없이 기쁜 마음으로 기억하겠습니다.`,
  hero: "images/web/hero.jpg", // 원본 images/hero.jpg 를 optimize-images.py 가 그대로 복사한 것(화질 저하 금지: 줄이거나 다시 압축하지 않음)
  // 커버 물결: 사진 가로 위치(0~1)로 신랑 발, 신부 드레스 끝. 물결이 신랑 발 아래에서 가장 깊고 신부 아래도 낮게 지나간다(2026-11-23). 사진을 바꾸면 이 값을 다시 잰다
  heroFeet: { groom: 0.665, bride: 0.46 },
  // 우리의 순간. 위에서부터 순서대로 놓인다. 원본은 images/moments/<번호>-<제목>.jpeg, 쓰는 것은 optimize-images.py 가 만든 images/web/m<번호>-<n>.jpg
  // 2026-11-23 장 제목(title)은 모두 빼기로 함. 글만 둔다

// 커버 물결: 화면 폭에 따라 사진이 잘리는 위치가 달라서, 신랑 발이 화면의 어디에 오는지 계산해 그 아래를 가장 깊게 그린다
function drawWave() {
  const img = $(".hero img"), hero = $(".hero");
  if (!img || !img.naturalWidth) return;
  const w = hero.clientWidth, h = hero.clientHeight;
  const sc = Math.max(w / img.naturalWidth, h / img.naturalHeight), dw = img.naturalWidth * sc, off = (dw - w) / 2;
  const at = (f) => Math.min(.92, Math.max(.08, (f * dw - off) / w)) * 480;
  const g = at(W.heroFeet.groom), b = Math.min(at(W.heroFeet.bride), g - 40);
  // (x, y): y 가 클수록 물결이 낮다(48 이 맨 아래). 신랑 발 아래 47, 신부 아래 40, 양 끝은 높게
  const pts = [[0, 12], [b * .45, 20], [b, 40], [g, 47], [g + (480 - g) * .55, 36], [480, 18]];
  let d = `M${pts[0][0]} ${pts[0][1]}`;
  for (let i = 0; i < pts.length - 1; i++) { // Catmull-Rom → 베지어로 부드럽게
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6], c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += ` C${c1[0].toFixed(1)} ${Math.min(48, c1[1]).toFixed(1)}, ${c2[0].toFixed(1)} ${Math.min(48, c2[1]).toFixed(1)}, ${p2[0].toFixed(1)} ${p2[1]}`;
  }
  $("#wave").setAttribute("d", d + " L480 48 L0 48 Z");
}

// 토스트, 복사
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 1600); }
async function copy(text, msg) {
  try { await navigator.clipboard.writeText(text); }
  catch { const ta = document.createElement("textarea"); ta.value = text; document.body.append(ta); ta.select(); document.execCommand("copy"); ta.remove(); }
  toast(msg);
}

document.addEventListener("click", (e) => {
  const c = e.target.closest("[data-copy]"); if (c) return copy(c.dataset.copy, "계좌번호를 복사했습니다");
  const t = e.target.closest(".acc-toggle"); if (t) return t.parentElement.classList.toggle("open");
  const gb = e.target.closest(".frame[data-i]"); if (gb) return openLightbox(+gb.dataset.i);
});
$("#copylink").addEventListener("click", () => copy(location.href, "링크를 복사했습니다"));
$("#share").addEventListener("click", async () => {

  if (navigator.share) { try { await navigator.share({ title: document.title, text: `${g.name} ♡ ${b.name} 결혼합니다`, url: location.href }); } catch {} }
  else copy(location.href, "링크를 복사했습니다");
});

// 배경음악: 브라우저는 소리 자동 재생을 막아서, 오프닝을 누르거나 첫 터치 때 켠다. 버튼으로 끄고 켠다
if (W.bgm) {
  const audio = new Audio(W.bgm); audio.loop = true; audio.preload = "auto";
  const btn = document.createElement("button");
  btn.className = "music"; btn.type = "button"; btn.setAttribute("aria-pressed", "false");
  const draw = () => { const on = !audio.paused; btn.setAttribute("aria-pressed", on); btn.innerHTML = `<span>♪</span> ${on ? "BGM ON" : "BGM OFF"}`; };
  draw(); document.body.append(btn);
  audio.addEventListener("play", draw); audio.addEventListener("pause", draw);
  let userOff = false;
  btn.addEventListener("click", (e) => { e.stopPropagation(); if (audio.paused) { userOff = false; audio.play().catch(() => {}); } else { userOff = true; audio.pause(); } });
  const first = () => { if (!userOff && audio.paused) audio.play().catch(() => {}); };
  document.addEventListener("pointerdown", first, { once: true });
}

// 사진 크게 보기
let cur = 0;
function openLightbox(i) {
  cur = i;
  const lb = $("#lightbox");
  lb.innerHTML = `<button class="close" aria-label="닫기">×</button><button class="nav prev" aria-label="이전">‹</button>
    ${photo(PHOTOS[i], `웨딩 사진 ${i + 1}`)}<button class="nav next" aria-label="다음">›</button><span class="count">${i + 1} / ${PHOTOS.length}</span>`;
  lb.classList.add("open"); document.body.classList.add("lock");
}
$("#lightbox").addEventListener("click", (e) => {
  const n = PHOTOS.length;
  if (e.target.closest(".prev")) return openLightbox((cur - 1 + n) % n);
  if (e.target.closest(".next")) return openLightbox((cur + 1) % n);
  if (e.target.closest(".close") || e.target.id === "lightbox") { $("#lightbox").classList.remove("open"); document.body.classList.remove("lock"); }
});
</script>
